<!DOCTYPE html>
<html lang="zh-CN" data-season="autumn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FCE5C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="四季手账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" id="fav" href="data:,">
<title>四季手账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
/* 布局：左侧导航 + 主区；主区顶部是一页"日历纸"色带（随季节变化），其余保持安静 */
:root{
  --bg:#FAF1E4;--surface:#FFFDF8;--surface2:#F4E6D2;--ink:#3A2212;--ink2:#7A5E4A;--line:#EBD8BE;
  --accent:#CF5C12;--accent-rgb:207,92,18;--on-accent:#fff;--second:#A8392B;--second-rgb:168,57,43;
  --hero1:#FBDDB6;--hero2:#F3B273;--hero-ink:#3A2212;
  --good:#2E8B57;--warn:#B77A00;--bad:#C8413B;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --font-display:"ZCOOL XiaoWei","Songti SC","STSong","SimSun",serif;
  --font-body:"Figtree","PingFang SC","Noto Sans SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
:root[data-season="spring"]{--bg:#F3F7EC;--surface:#FFFFFF;--surface2:#E8F0DD;--ink:#1F2E1B;--ink2:#5C6B55;--line:#D7E3C9;--accent:#3A8A2B;--accent-rgb:58,138,43;--on-accent:#fff;--second:#D1648A;--second-rgb:209,100,138;--hero1:#DCEFC6;--hero2:#F7DCE6;--hero-ink:#1F2E1B}
:root[data-season="summer"]{--bg:#F9F3E4;--surface:#FFFFFF;--surface2:#F1E7D0;--ink:#0F2D45;--ink2:#55697A;--line:#E6DABF;--accent:#1479C2;--accent-rgb:20,121,194;--on-accent:#fff;--second:#0E9AA6;--second-rgb:14,154,166;--hero1:#D6EFFC;--hero2:#9AD3F1;--hero-ink:#0F2D45}
:root[data-season="winter"]{--bg:#EEF1F6;--surface:#FFFFFF;--surface2:#E2E8F1;--ink:#1D2536;--ink2:#5B657A;--line:#D5DCE8;--accent:#B02E4C;--accent-rgb:176,46,76;--on-accent:#fff;--second:#5F78A8;--second-rgb:95,120,168;--hero1:#D3DCEB;--hero2:#B3C1DA;--hero-ink:#1D2536}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--good:#5DBB8A;--warn:#E0A93B;--bad:#EC7A75;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
    --bg:#1B130D;--surface:#251A12;--surface2:#32241A;--ink:#F4E7D8;--ink2:#B89F8A;--line:#40301F;--accent:#F08A3C;--accent-rgb:240,138,60;--on-accent:#2A1405;--second:#E06B55;--second-rgb:224,107,85;--hero1:#5A3516;--hero2:#3A2313;--hero-ink:#FBEBD9}
  :root:not([data-theme="light"])[data-season="spring"]{--bg:#141A12;--surface:#1C241A;--surface2:#263022;--ink:#E6EEDF;--ink2:#9DAD94;--line:#313D2C;--accent:#7CC267;--accent-rgb:124,194,103;--on-accent:#10200B;--second:#E891A9;--second-rgb:232,145,169;--hero1:#2C4424;--hero2:#472E3A;--hero-ink:#EDF5E6}
  :root:not([data-theme="light"])[data-season="summer"]{--bg:#0C1A26;--surface:#122434;--surface2:#1A3145;--ink:#E3EEF6;--ink2:#93A8B9;--line:#234058;--accent:#4FB0EE;--accent-rgb:79,176,238;--on-accent:#06202F;--second:#E8C98A;--second-rgb:232,201,138;--hero1:#14405E;--hero2:#0F2C44;--hero-ink:#E9F4FB}
  :root:not([data-theme="light"])[data-season="winter"]{--bg:#11151E;--surface:#181E2A;--surface2:#222A39;--ink:#E6EAF2;--ink2:#98A2B5;--line:#2D3648;--accent:#E8718C;--accent-rgb:232,113,140;--on-accent:#2A0A14;--second:#8FA6D3;--second-rgb:143,166,211;--hero1:#2A3550;--hero2:#1C2436;--hero-ink:#EDF0F7}
}
:root[data-theme="dark"]{color-scheme:dark;--good:#5DBB8A;--warn:#E0A93B;--bad:#EC7A75;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;
  --bg:#1B130D;--surface:#251A12;--surface2:#32241A;--ink:#F4E7D8;--ink2:#B89F8A;--line:#40301F;--accent:#F08A3C;--accent-rgb:240,138,60;--on-accent:#2A1405;--second:#E06B55;--second-rgb:224,107,85;--hero1:#5A3516;--hero2:#3A2313;--hero-ink:#FBEBD9}
:root[data-theme="dark"][data-season="spring"]{--bg:#141A12;--surface:#1C241A;--surface2:#263022;--ink:#E6EEDF;--ink2:#9DAD94;--line:#313D2C;--accent:#7CC267;--accent-rgb:124,194,103;--on-accent:#10200B;--second:#E891A9;--second-rgb:232,145,169;--hero1:#2C4424;--hero2:#472E3A;--hero-ink:#EDF5E6}
:root[data-theme="dark"][data-season="summer"]{--bg:#0C1A26;--surface:#122434;--surface2:#1A3145;--ink:#E3EEF6;--ink2:#93A8B9;--line:#234058;--accent:#4FB0EE;--accent-rgb:79,176,238;--on-accent:#06202F;--second:#E8C98A;--second-rgb:232,201,138;--hero1:#14405E;--hero2:#0F2C44;--hero-ink:#E9F4FB}
:root[data-theme="dark"][data-season="winter"]{--bg:#11151E;--surface:#181E2A;--surface2:#222A39;--ink:#E6EAF2;--ink2:#98A2B5;--line:#2D3648;--accent:#E8718C;--accent-rgb:232,113,140;--on-accent:#2A0A14;--second:#8FA6D3;--second-rgb:143,166,211;--hero1:#2A3550;--hero2:#1C2436;--hero-ink:#EDF0F7}

/* 整页背景：随季节变化的渐变（上 → 下） */
:root{--bg1:#FCE5C6;--bg2:#F6CDA0;--side:rgba(255,255,255,.46)}
:root[data-season="spring"]{--bg1:#DDEFC8;--bg2:#FBE6EE}
:root[data-season="summer"]{--bg1:#BDE3F8;--bg2:#F7E8C4}
:root[data-season="winter"]{--bg1:#D4DEED;--bg2:#F4F6FA}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2E1C0D;--bg2:#1A110B;--side:rgba(0,0,0,.22)}
  :root:not([data-theme="light"])[data-season="spring"]{--bg1:#182612;--bg2:#241A22}
  :root:not([data-theme="light"])[data-season="summer"]{--bg1:#0B2638;--bg2:#1B2429}
  :root:not([data-theme="light"])[data-season="winter"]{--bg1:#18203A;--bg2:#0E1118}
}
:root[data-theme="dark"]{--bg1:#2E1C0D;--bg2:#1A110B;--side:rgba(0,0,0,.22)}
:root[data-theme="dark"][data-season="spring"]{--bg1:#182612;--bg2:#241A22}
:root[data-theme="dark"][data-season="summer"]{--bg1:#0B2638;--bg2:#1B2429}
:root[data-theme="dark"][data-season="winter"]{--bg1:#18203A;--bg2:#0E1118}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg) linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;transition:background-color .5s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
ul{list-style:none;margin:0;padding:0}

#app{flex:1;min-height:0;display:flex;position:relative}
#bgfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#side{width:212px;flex:none;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line);background:var(--side);position:relative;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.wrap{max-width:1060px;margin:0 auto;padding:18px clamp(16px,3vw,30px) 48px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--font-display);font-size:22px;font-weight:400;letter-spacing:.06em}
.seal{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--second);color:var(--second);border-radius:8px;font-family:var(--font-display);font-size:19px;transform:rotate(-6deg);flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a[aria-current="page"]{background:rgba(var(--accent-rgb),.14);color:var(--ink);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink2);padding:0 6px}
.streak{font-size:13px;color:var(--ink2);padding:10px;border:1px dashed var(--line);border-radius:10px}
.streak b{font-family:var(--font-display);font-size:26px;color:var(--ink);font-weight:400;margin-right:4px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink2);flex:none}
.sync.ok i{background:var(--good)}.sync.saving i{background:var(--warn)}.sync.bad i{background:var(--bad)}

#tabbar{display:none;flex:none;border-top:1px solid var(--line);background:var(--surface);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
#tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:11px;color:var(--ink2);text-decoration:none;border-radius:10px}
#tabbar a svg{width:20px;height:20px}
#tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
@media (max-width:820px){#side{display:none}#tabbar{display:flex}}
@media (max-width:560px){.hero .seal{display:none}.hero{padding:16px}}

#timerbar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:var(--bg)}
#timerbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#timerbar .el{font-size:18px;font-weight:600}
#timerbar button{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}

/* hero：一页日历纸 */
.hero{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--hero-ink);padding:20px 22px;display:flex;align-items:flex-end;gap:14px 18px;flex-wrap:wrap;min-height:128px;transition:background .5s}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas){position:relative}
.hero .big{font-family:var(--font-display);font-size:clamp(64px,11vw,92px);line-height:.86;letter-spacing:-.01em}
.hero .big small{font-size:.3em;margin-left:6px;letter-spacing:.1em}
.hero .big.txt{font-size:clamp(34px,6vw,46px);line-height:1.1}
.hero .ht{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;padding-bottom:2px}
.hero .ht b{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.04em}
.hero .ht span{font-size:13px;opacity:.82}
.hero .hx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero .seal{position:absolute;top:16px;right:18px;width:40px;height:40px;font-size:23px;background:rgba(255,255,255,.35)}
.hbtn{height:36px;min-width:36px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.55);color:var(--hero-ink);font-weight:600;font-size:14px;display:inline-grid;place-items:center;backdrop-filter:blur(4px)}
:root[data-theme="dark"] .hbtn,:root[data-theme="dark"] .hero .seal{background:rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hbtn,:root:not([data-theme="light"]) .hero .seal{background:rgba(0,0,0,.28)}}
.hbtn:hover{background:rgba(255,255,255,.8)}
.hbtn.solid{background:var(--hero-ink);color:var(--hero1)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card>h2,.sec-h{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sec-h small,.card>h2 small{font-weight:400;color:var(--ink2);font-size:13px}
.sec-h .sp{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--ink2)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.inp{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-width:0;width:100%}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:84px;line-height:1.6}
.inp:focus{outline:2px solid rgba(var(--accent-rgb),.5);border-color:var(--accent)}
.inp.sm{height:32px;padding:0 8px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}

/* 概览条 */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi b{font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--ink2)}
.kpi em.up{color:var(--good)}.kpi em.down{color:var(--bad)}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.two{position:relative}

/* 快速添加 */
.qa{display:flex;flex-direction:column;gap:10px}
.qa .row1{display:flex;gap:8px}
.qa .row1 .inp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--surface);color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--surface2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--ink2)}

/* 待做 / 已做 */
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:720px){.cols2{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);flex:none;margin-top:1px;display:grid;place-items:center;transition:.15s}
.chk:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.12)}
.is-done .chk{background:var(--accent);border-color:var(--accent)}
.is-done .chk::after{content:"";width:9px;height:5px;border:2px solid var(--on-accent);border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t-title{font-weight:500;overflow-wrap:anywhere}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink2);align-items:center}
.t-meta span{display:inline-flex;align-items:center;gap:4px}
.t-side{display:flex;align-items:center;gap:6px;flex:none}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.over{background:rgba(var(--second-rgb),.16)}
.pill.add{border:1px dashed var(--ink2);background:transparent;color:var(--ink2)}
.play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);background:var(--surface)}
.play:hover{border-color:var(--accent)}
.play.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.play svg{width:12px;height:12px}
.empty{color:var(--ink2);font-size:13px;padding:14px 0;text-align:left}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:rgba(var(--accent-rgb),.1);border:1px solid rgba(var(--accent-rgb),.3);font-size:14px}
.banner .sp{flex:1}

/* 时间轴 */
.tl{position:relative;height:38px;background:var(--surface2);border-radius:8px;overflow:hidden}
.tl i{position:absolute;top:5px;bottom:5px;border-radius:4px;min-width:3px;opacity:.92;box-shadow:0 0 0 1px var(--surface2)}
.tl-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}

/* 标签用时条 */
.share{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface2);margin-bottom:12px}
.share i{display:block;min-width:3px}
.tagrow{display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.tagrow .nm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tagrow .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.tagrow .bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.tagrow .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.tagrow .p{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px;width:38px;text-align:right}
.actrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}
.actrow:first-child{border-top:0}
.actrow .n{color:var(--ink2);font-size:12px;white-space:nowrap}
.actrow .nm{display:flex;align-items:center;gap:6px;min-width:0}
.actrow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 柱状图 */
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:var(--h);font-size:11px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.plot{position:relative;height:var(--h);border-bottom:1px solid var(--line)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.cols{position:absolute;inset:0;display:grid;gap:clamp(2px,1.2%,10px);padding:0 2px}
.col{position:relative;height:100%;border-radius:6px 6px 0 0}
.col:hover{background:rgba(var(--accent-rgb),.07)}
.col .stack{position:absolute;left:14%;right:14%;bottom:0;display:flex;flex-direction:column-reverse;gap:2px;max-width:44px;margin:0 auto}
.col .stack i{display:block;min-height:2px}
.col .stack i:last-child{border-radius:4px 4px 0 0}
.col em{position:absolute;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.xax{grid-column:2;display:grid;gap:clamp(2px,1.2%,10px);padding:4px 2px 0;font-size:12px;color:var(--ink2);text-align:center}
.xax .cur{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* 周 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}}
.wd{background:var(--surface);justify-content:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.wd:hover{border-color:var(--accent)}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wd .h{display:flex;align-items:baseline;gap:6px;justify-content:space-between}
.wd .h b{font-family:var(--font-display);font-weight:400;font-size:20px}
.wd .h span{font-size:12px;color:var(--ink2)}
.its{display:flex;flex-direction:column;gap:3px;min-width:0}
.its li{display:flex;align-items:center;gap:4px;min-width:0;font-size:12.5px;line-height:1.35;border-left:3px solid var(--tc,var(--ink2));padding-left:5px}
.its li>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.its li svg{width:11px;height:11px;flex:none;color:var(--good)}
.its li i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink2);flex:none}
.its li.od{color:var(--bad);font-weight:600}
.its li.od i{border-color:var(--bad)}
.its li.more{border-left-color:transparent;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wd .ft{margin-top:auto;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* 月历 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wh{font-size:12px;color:var(--ink2);text-align:center;padding-bottom:2px}
.cal-d{min-height:128px;border-radius:10px;border:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;justify-content:flex-start;gap:5px;background:var(--surface);text-align:left;min-width:0;overflow:hidden}
.cal-d:hover{border-color:var(--accent)}
.cal-d .ch{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-width:0}
.cal-d b{font-size:15px;font-weight:600;line-height:1.1}
.cal-d .cnt{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-d .its li{font-size:11.5px}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.h1{background:rgba(var(--accent-rgb),.10)}.h2{background:rgba(var(--accent-rgb),.22)}.h3{background:rgba(var(--accent-rgb),.38)}.h4{background:rgba(var(--accent-rgb),.58)}
@media (max-width:640px){.cal{gap:3px}.cal-d{padding:4px 3px;min-height:96px;gap:3px}.cal-d .cnt{display:none}.cal-d .its{gap:2px}.cal-d .its li{font-size:10px;border-left-width:2px;padding-left:2px;gap:1px}.cal-d .its li i{display:none}.cal-d .its li svg{width:8px;height:8px}}

/* 年度热力图 */
.heatwrap{overflow-x:auto;padding-bottom:4px}
.heat{display:inline-grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,13px);gap:3px}
.heat span{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:visible;width:13px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface2);display:block}
.heat i.x{background:transparent}
.heat i.today{outline:2px solid var(--ink);outline-offset:0}
.heat i.h1{background:rgba(var(--accent-rgb),.22)}.heat i.h2{background:rgba(var(--accent-rgb),.45)}.heat i.h3{background:rgba(var(--accent-rgb),.7)}.heat i.h4{background:var(--accent)}
.scale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.scale i{width:12px;height:12px;border-radius:3px;background:var(--surface2);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:4px 10px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}

/* 项目 */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.proj-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 16px;width:100%;align-items:center}
.proj-h h3{font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proj-h .pc{font-family:var(--font-display);font-size:30px;line-height:1;grid-row:span 2;text-align:right}
.proj-h .pc small{font-size:14px}
.proj-h .meta{font-size:13px;color:var(--ink2)}
.pbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;grid-column:1/-1;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.pbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.tagk{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--ink2)}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.g{background:rgba(46,139,87,.16);color:var(--good)}.st.w{background:rgba(183,122,0,.16);color:var(--warn)}.st.b{background:rgba(200,65,59,.14);color:var(--bad)}
.proj-b{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.stage{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stage-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:4px}
.stage-h .sp{flex:1}
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.goal .gm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink2);grid-column:2/-1}
.goal input[type=range]{width:110px;accent-color:var(--accent)}
.goal.is-done .gt{color:var(--ink2);text-decoration:line-through}
.x{color:var(--ink2);width:26px;height:26px;border-radius:6px;display:inline-grid;place-items:center;font-size:16px;flex:none}
.x:hover{background:var(--surface2);color:var(--bad)}
.x[data-armed]{width:auto;padding:0 8px;font-size:12px;color:var(--bad);background:rgba(200,65,59,.12)}
.spark{width:100%;height:auto;display:block}
.rubric{font-size:13px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.rubric b{color:var(--ink)}
.logs{display:flex;flex-wrap:wrap;gap:6px}
.logs span{font-size:12px;background:var(--surface2);border-radius:8px;padding:3px 4px 3px 8px;display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.logs .x{width:18px;height:18px;font-size:13px}
.strip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.strip:first-of-type{border-top:0}
.strip .pbar{height:6px}

/* 设置 */
.tagedit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:560px){.themes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.theme{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;background:var(--surface)}
.theme[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.theme i{height:26px;border-radius:7px;display:block}

/* 弹层 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.dlg.wide{width:min(680px,100%)}
.dlg h2{font-size:17px;display:flex;align-items:center}
.dlg h2 .sp{flex:1}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .foot .sp{flex:1}
.dlg img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
#tip{position:fixed;z-index:40;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.welcome{display:flex;flex-direction:column;gap:10px}
.welcome h2{font-family:var(--font-display);font-weight:400;font-size:22px}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);display:block}
.ph img{width:100%;height:100%;object-fit:cover;display:block;border:0;border-radius:0}
.ph img:not([src]){visibility:hidden}
.ph.miss::after{content:"这张照片不在这台设备上";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--ink2);padding:6px;text-align:center}
.ph.big{aspect-ratio:auto;border:0;background:none;min-height:120px}
.ph.big img{height:auto;max-height:68vh;object-fit:contain}
.auth{max-width:440px;width:100%;margin:5vh auto 0;display:flex;flex-direction:column;gap:14px}
.auth form{display:flex;flex-direction:column;gap:10px}
.msg{font-size:13px;min-height:1.3em;margin:0}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 提醒条 / 记账 / 报告 */
#remindbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:8px clamp(12px,3vw,24px);display:flex;flex-direction:column;gap:6px;max-height:40%;overflow:auto;position:relative;z-index:2}
.rm-row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:6px 10px;border-radius:10px;background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.35)}
.rm-row .g{flex:1;min-width:140px;font-weight:600}
.rm-row .g small{color:var(--ink2);margin-left:8px;font-weight:400}
.bill{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.bill:first-child,.bday+.bill{border-top:0}
.bill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill b.in{color:var(--good)}
.bday{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink2);padding:12px 0 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bday:first-child{border-top:0;padding-top:0}
.mbars{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--line)}
.mbars button{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;border-radius:4px 4px 0 0}
.mbars button:hover{background:rgba(var(--accent-rgb),.08)}
.mbars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0}
.mbars .td i{background:var(--second)}
.x.xs{width:18px;height:18px;font-size:13px}
.x.xs[data-armed]{width:auto;height:auto}
.hl{display:flex;flex-direction:column;gap:10px}
.hl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:baseline;line-height:1.5}
.hl li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translateY(-1px)}
.hl li.star::before{content:"★";background:none;width:auto;height:auto;color:var(--accent);font-size:13px;transform:none}
.hl small{display:block;color:var(--ink2);font-size:12px}
.rep-lead p{margin:0;font-size:16px;line-height:1.8}
.lnk{color:var(--accent);text-decoration:underline;font-size:inherit;font-weight:500}
.foot-m{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.card>h2+.foot-m{border-top:0}
@media (max-width:480px){#tabbar{padding-left:2px;padding-right:2px}#tabbar a{font-size:10px}#tabbar a svg{width:18px;height:18px}}
/* 通透质感：磨砂玻璃卡片 + 果冻按钮 */
:root{--hi:rgba(255,255,255,.7);--glass:76%;--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hi:rgba(255,255,255,.08);--glass:68%}}
:root[data-theme="dark"]{--hi:rgba(255,255,255,.08);--glass:68%}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.14))}
.hero{box-shadow:inset 0 1px 0 var(--hi),0 16px 36px -24px rgba(var(--accent-rgb),.7)}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none;z-index:0}
.hero>*:not(canvas){z-index:1}
.btn.pri{background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 54%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -8px rgba(var(--accent-rgb),.9)}
.btn,.inp{border-radius:12px}
.chip{backdrop-filter:none}
@supports (background:color-mix(in srgb,red 50%,transparent)){
  .card,.kpi,.proj{background:color-mix(in srgb,var(--surface) var(--glass),transparent);-webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35);border-color:color-mix(in srgb,var(--line) 50%,transparent);box-shadow:inset 0 1px 0 var(--hi),0 12px 30px -22px rgba(var(--accent-rgb),.55)}
  .wd,.cal-d,.stage{background:color-mix(in srgb,var(--surface) 58%,transparent);border-color:color-mix(in srgb,var(--line) 60%,transparent)}
  #tabbar,#remindbar{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
  .inp{background:color-mix(in srgb,var(--surface) 86%,transparent)}
  .btn{background:color-mix(in srgb,var(--surface) 82%,transparent)}
  .btn.pri{background-color:var(--accent)}
  .btn.ghost{background:transparent}
  .dlg{background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
}
.bill button.nm{text-align:left}
.bill button.nm:hover{color:var(--accent)}
/* 简洁版：更少的框、更少的颜色、默认不动 */
:root:not([data-fx="on"]) #bgfx,:root:not([data-fx="on"]) .hero canvas{display:none}
#side{width:184px}
.card,.kpi,.proj{box-shadow:none}
.hero{min-height:0;padding:16px 20px;box-shadow:none}
.hero::after,.hero .seal{display:none}
.hero .big{font-size:clamp(46px,8vw,62px)}
.hero .big.txt{font-size:clamp(28px,5vw,36px)}
.sum{gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.sum .kpi{background:none;border:0;border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none;border-left:1px solid var(--line)}
.sum .kpi:first-child{border-left:0}
@media (max-width:720px){.sum .kpi:nth-child(odd){border-left:0}.sum .kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.sum.flat{border:0;background:none;border-radius:0}
.sum.flat .kpi{padding-left:0}
.sum.flat .kpi+.kpi{padding-left:14px}
@supports (background:color-mix(in srgb,red 50%,transparent)){.sum{background:color-mix(in srgb,var(--surface) var(--glass),transparent)}.sum.flat{background:none}}
.its li{border-left:0;padding-left:0}
.qa .more{display:none}
.qa:focus-within .more{display:flex}
.dsum{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--ink2);padding:0 4px}
.dsum b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.dsum .meter{flex:1;min-width:90px;margin:0}
.tcard{padding:12px 16px}
.tcard .tclock{font-size:22px;font-weight:700}
.tcard .btn svg{width:11px;height:11px}
.play{width:auto;height:28px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.play::after{content:"计时"}
.play.on::after{content:"停止"}
.t-meta>span:nth-child(n+4){display:none}
.calseg{margin:-4px 0}
.fold>h2{cursor:pointer;margin-bottom:0;-webkit-user-select:none;user-select:none}
.fold.open>h2{margin-bottom:12px}
.fold:not(.open)>*:not(h2){display:none!important}
.fold>h2::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:none}
.fold.open>h2::after{transform:rotate(-135deg) translate(-2px,-2px)}
.fold>h2 .sp{flex:0}
/* 打分 */
.scgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 28px}
.scrow{display:grid;grid-template-columns:minmax(72px,1fr) auto 1.6em;gap:10px;align-items:center}
.scrow .nm em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
.dots{display:inline-flex;gap:7px}
.dots button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:.12s}
.dots button:hover{border-color:var(--accent)}
.dots button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
/* 每日一句、当日提醒、日历上的分数 */
.quote{margin-top:10px;padding:10px 12px 0;text-align:center;color:var(--ink2);font-size:12px;line-height:1.7;display:flex;flex-direction:column;align-items:center;gap:1px}
.quote .o{font-family:var(--font-display);font-size:13.5px;color:var(--ink);opacity:.72;max-width:60ch;text-wrap:balance}
.quote .z{max-width:60ch;text-wrap:balance}
.quote cite{font-style:normal;font-size:11px;opacity:.8}
.daytip{font-size:13px;line-height:1.7;margin:12px 0 0;padding:9px 12px;border-radius:10px;background:rgba(var(--accent-rgb),.09)}
.scb{font-size:10px;font-weight:700;line-height:16px;padding:0 5px;border-radius:99px;background:rgba(var(--accent-rgb),.16);margin-left:5px;font-variant-numeric:tabular-nums;vertical-align:middle}
.scrow{grid-template-columns:minmax(72px,1fr) auto minmax(1.6em,auto)}
.sug{font-size:11px;font-weight:600;color:var(--accent);border:1px dashed var(--accent);border-radius:99px;padding:1px 8px;white-space:nowrap}
.sug:hover{background:rgba(var(--accent-rgb),.12)}
/* 收敛：次要入口收进「更多」，提示条靠后，算法说明 */
.wrap>.banner:not(.tfbar){order:6}
.wrap>.modhint{order:8;text-align:center;margin:0}
.wrap>.quote{order:9}
.hmore{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.hmore>summary{list-style:none;cursor:pointer}

  if(p.kind==='qty'){const win=Math.min(14,el),from=addDays(td,-win+1);pace=(p.logs||[]).filter(l=>l.d>=from&&l.d<=td).reduce((a,l)=>a+l.n,0)/win;out.remain=Math.max(0,(p.target||0)-out.sum)}

  else{

function onSnap(snap){

    if(!Store.synced){Store.synced=true;clearTimeout(Store.loadT);if(Store.dirty.size){clearTimeout(Store.timer);Store.timer=setTimeout(flush,300)}
      if(!seen.size&&adoptLocal())changed=true;
      else{for(const ym in S.months)if(!seen.has('m-'+ym)&&Object.keys(S.months[ym].tasks||{}).length)touch('m-'+ym);
        if(!seen.has('meta'))touch('meta');
        for(const id in S.projects){const did='p-'+id;if(!seen.has(did)&&!Store.known.has(did))touch(did)}}
    }
    for(const id of Object.keys(S.projects)){const did='p-'+id;if(!seen.has(did)&&Store.known.has(did)&&!Store.dirty.has(did)&&!Store.writing[did]){delete S.projects[id];Store.known.delete(did);delete Store.lastJson[did];changed=true}}

  }
  if(changed){REV++;saveLocal();render()}

  let session=null,netErr=false,last=null;try{last=JSON.parse(localStorage.getItem('sjsz:last')||'null')}catch(e){}
  const canOff=!!(last&&last.uid&&readLocal('sjsz:'+last.uid)),isNet=e=>!!e&&(e.name==='AuthRetryableFetchError'||/fetch|network|load failed/i.test(e.message||''));
  // 没网时刷新登录凭证会一直重试：有本机缓存就不等它，先打开
  const gs=Store.sb.auth.getSession().catch(e=>({data:{session:null},error:{name:'AuthRetryableFetchError',message:String(e)}}));
  const r=canOff?await Promise.race([gs,new Promise(res=>setTimeout(()=>res(null),navigator.onLine===false?400:3000))]):await gs;
  if(!r){netErr=true;gs.then(x=>{if(Store.mode!=='cloud')return;if(x&&x.data&&x.data.session){try{dispatchEvent(new Event('online'))}catch(e){}}else if(x&&!isNet(x.error)){try{localStorage.removeItem('sjsz:last')}catch(e){}location.reload()}})}
  else{session=r.data&&r.data.session;if(!session&&isNet(r.error))netErr=true}
  pwaSetup();
  if(!session&&canOff&&netErr){enterCloud(supaApi(Store.sb,last.uid),supaPics(Store.sb,last.uid),last.uid,last.email||'');toast('现在没有网络，先显示本机保存的数据，联网后自动同步')}
  else if(session)signedIn(session);else{let skip=false;try{skip=localStorage.getItem('sjsz:skip')==='1'}catch(e){}if(skip)enterLocal();else showAuth()}
  Store.sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{if(ev==='SIGNED_IN'&&s&&Store.mode==='auth')signedIn(s);else if(ev==='SIGNED_OUT'&&Store.mode==='cloud'){try{localStorage.removeItem('sjsz:last')}catch(e){}location.reload()}},0)});
}

/* ========== 周 / 月 / 年 ========== */
const CHK='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6.5l2.8 2.8L10 3.6"/></svg>';
function sortedItems(d){return dayItems(d).slice().sort((a,b)=>(b.star?1:0)-(a.star?1:0)||(b.done?1:0)-(a.done?1:0)||(a.done?(a.at||0)-(b.at||0):(a.c||0)-(b.c||0)))}
/* 日历格子里的事项：做完的打勾，过了当天还没做的标红 */
function itemsList(d,max){
  const td=today(),its=sortedItems(d);if(!its.length)return'';
  return `<ul class="its">${its.slice(0,max).map(t=>{const od=!t.done&&d<td;return `<li class="${t.done?'d':od?'od':''}" style="--tc:${tagColor(t.g)}">${t.done?CHK:'<i></i>'}<span>${t.star?'★ ':''}${esc(t.t)}${od?'<span class="sr">（逾期未完成）</span>':t.done?'<span class="sr">（已完成）</span>':''}</span></li>`}).join('')}${its.length>max?`<li class="more"><span>还有 ${its.length-max} 项</span></li>`:''}</ul>`;
}
function vWeek(){
  const[a,b]=rangeOf('week',UI.date),st=calc(a,b),pv=calcPrev('week',a,b),td=today();
  const days=[...Array(7)].map((_,i)=>addDays(a,i));
  const cols=days.map(d=>{const x=st.byDay[d]||{min:0,byTag:{}};return{label:'周'+WD[parse(d).getDay()],min:x.min,byTag:x.byTag,d,act:'goDay',cur:d===td,tip:mdCN(d)}});
  return `<section class="card"><div class="sec-h">这一周做了什么 <small>打勾的是做完的，红色是逾期没做的；点某一天进入当天</small></div>
  <div class="week">${days.map(d=>{const it=dayItems(d),x=st.byDay[d]||{min:0,done:0,all:0},np=dayPics(d).length;return `<button class="wd ${d===td?'today':''}" data-act="goDay" data-d="${d}"><span class="h"><b class="num">${parse(d).getDate()}</b><span>周${WD[parse(d).getDay()]}</span></span>${itemsList(d,12)}<span class="ft">${it.length?`${it.filter(t=>t.done).length}/${it.length} 完成`:'无事项'}${x.min?' · '+fmtH(x.min):''}${np?` · ${np} 张照片`:''}</span></button>`}).join('')}</div></section>
  <section class="card"><h2>每天的用时 <small>按标签堆叠，点柱子进入当天</small></h2>${barChart(cols,170)}${legend(st.byTag)}</section>
  ${statsBlock('week',st,pv,7)}`;
}
function lvl(x){if(!x)return 0;if(UI.metric==='cnt'){const n=x.done;return n>=8?4:n>=5?3:n>=3?2:n>=1?1:0}const m=x.min;return m>=300?4:m>=180?3:m>=60?2:m>0?1:0}
function metricSeg(){return `<span class="seg" role="group" aria-label="热度依据"><button data-act="metric" data-m="min" aria-pressed="${UI.metric==='min'}">按用时</button><button data-act="metric" data-m="cnt" aria-pressed="${UI.metric==='cnt'}">按完成数</button></span>`}
function scaleKey(){return `<span class="scale">少<i></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i>多</span>`}
function vMonth(){
  const[a,b]=rangeOf('month',UI.date),st=calc(a,b),pv=calcPrev('month',a,b),td=today(),n=diffDays(a,b)+1,lead=(parse(a).getDay()+6)%7;
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let i=0;i<n;i++){const d=addDays(a,i),x=st.byDay[d],its=dayItems(d),od=d<td?its.filter(t=>!t.done).length:0,np=dayPics(d).length;
    cells+=`<button class="cal-d ${d===td?'today':''}" data-act="goDay" data-d="${d}" aria-label="${mdCN(d)}，完成 ${x?x.done:0}/${its.length}${od?`，逾期 ${od} 项`:''}"><span class="ch"><b class="num">${i+1}</b><span class="cnt">${its.length?`${x?x.done:0}/${its.length}`:''}${x&&x.min?' · '+fmtH(x.min):''}${np?` · ${np}图`:''}</span></span>${itemsList(d,4)}</button>`}
  return `<section class="card"><div class="sec-h">月历 <small>打勾的是做完的，红色是逾期没做的；点格子进入当天</small></div>

function vYear(){
  const y=+UI.date.slice(0,4),a=y+'-01-01',b=y+'-12-31',st=calc(a,b),pv=calcPrev('year',a,b),td=today(),n=diffDays(a,b)+1;

    const first=d;let lab='';for(let i=0;i<7;i++){const x=addDays(first,i);if(x>=a&&x<=b&&parse(x).getDate()<=7&&parse(x).getMonth()!==lastM){lastM=parse(x).getMonth();lab=(lastM+1)+'月';break}}
    cells+=`<span>${lab}</span>`;
    for(let i=0;i<7;i++){const x=addDays(first,i);if(x<a||x>b){cells+='<i class="x"></i>';continue}const v=st.byDay[x];cells+=`<i class="h${lvl(v)} ${x===td?'today':''}" data-act="goDay" data-d="${x}" data-tip="${mdCN(x)} 周${WD[parse(x).getDay()]} · ${v?`完成 ${v.done} 项 · ${fmtMin(v.min)}`:'无记录'}"></i>`}

/* ========== 项目视图 ========== */
function spark(p,c){
  // 累计进度折线 + 目标线 + 预测虚线
  const td=today(),start=p.start||td;let pts=[],max;
  if(p.kind==='qty'){max=p.target||1;const by={};for(const l of p.logs||[])if(l.d<=td)by[l.d]=(by[l.d]||0)+l.n;let acc=0;const ds=Object.keys(by).sort();const s0=ds.length&&ds[0]<start?ds[0]:start;pts.push({d:s0,v:0});for(const d of ds){acc+=by[d];pts.push({d,v:acc})}if(pts[pts.length-1].d<td)pts.push({d:td,v:acc})}
  else{max=100;const h=p.hist||{};pts.push({d:start,v:0});for(const d of Object.keys(h).sort())if(d>=start)pts.push({d,v:h[d]});if(pts[pts.length-1].d<td)pts.push({d:td,v:c.pct})}
  const d0=pts[0].d;let d1=td;if(p.due&&p.due>d1)d1=p.due;if(c.eta&&c.eta>d1&&diffDays(td,c.eta)<400)d1=c.eta;if(d1===d0)d1=addDays(d0,1);
  const W=600,H=92,px=d=>8+diffDays(d0,d)/diffDays(d0,d1)*(W-16),py=v=>H-10-Math.min(1,v/max)*(H-22);
  const line=pts.map(q=>`${px(q.d).toFixed(1)},${py(q.v).toFixed(1)}`).join(' ');const last=pts[pts.length-1];
  const proj=c.eta&&c.pct<100?`<line x1="${px(last.d)}" y1="${py(last.v)}" x2="${px(c.eta>d1?d1:c.eta)}" y2="${c.eta>d1?py(last.v+(max-last.v)*diffDays(td,d1)/Math.max(1,diffDays(td,c.eta))):py(max)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5" opacity=".6"/>`:'';
  const due=p.due?`<line x1="${px(p.due)}" x2="${px(p.due)}" y1="6" y2="${H-10}" stroke="var(--ink2)" stroke-dasharray="2 4"/><text x="${px(p.due)-4}" y="${H-14}" text-anchor="end" font-size="11" fill="var(--ink2)">截止</text>`:'';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="累计进度走势"><line x1="8" x2="${W-8}" y1="${py(max)}" y2="${py(max)}" stroke="var(--line)" stroke-dasharray="4 4"/><line x1="8" x2="${W-8}" y1="${H-10}" y2="${H-10}" stroke="var(--line)"/>${due}
  <polygon points="${px(pts[0].d)},${H-10} ${line} ${px(last.d)},${H-10}" fill="rgba(var(--accent-rgb),.14)"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${proj}<circle cx="${px(last.d)}" cy="${py(last.v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>
  <div class="tl-ax"><span>${mdCN(d0)}</span><span>截至今天${p.kind==='qty'?'累计 '+c.sum+' '+esc(p.unit||''):' '+c.pct.toFixed(1)+'%'}</span><span>${mdCN(d1)}</span></div>`;
}
function forecastTxt(p,c){
  if(c.pct>=100)return '已全部完成。';const u=p.kind==='qty'?(p.unit||''):'个百分点';const parts=[];
  parts.push(c.pace>0?`近两周平均每天推进 ${p.kind==='qty'?Math.round(c.pace*10)/10:c.pace.toFixed(1)} ${u}，照此预计 ${c.eta?mdCN(c.eta)+'（'+diffDays(today(),c.eta)+' 天后）':'—'} 完成`:'近两周没有进展，暂时无法预测完成日期');
  if(p.due){if(c.left>=0)parts.push(`距截止 ${c.left} 天，之后每天需 ${p.kind==='qty'?Math.ceil(c.need):c.need.toFixed(1)} ${u}`);else parts.push(`已超过截止日 ${-c.left} 天`)}
  return parts.join('；')+'。';
}

      <div class="row">${Store.sample?`<button class="btn sm" data-act="aiW" data-id="${p.id}">智能加权（Claude 估算）</button>`:''}<button class="btn sm ghost" data-act="ruleW" data-id="${p.id}">恢复规则权重</button></div>`;
    }else{

    }

function authErr(e){const m=(e&&e.message)||'';

  if(/error sending|smtp|email.*delivery/i.test(m))return'邮件未能发送，请检查 Supabase 的发信服务配置后重试';
  if(/invalid login credentials/i.test(m))return'邮箱或密码不正确';

  if(/already registered|already been registered/i.test(m))return'这个邮箱已注册，直接登录即可';

  else{ns.push(`${open?'截至今天，':''}${per}完成了 ${st.done} 件事（共 ${st.all} 件，完成率 ${rate}%）`+(st.min?`，累计投入 ${fmtMin(st.min)}`+(ended&&pv.min?`，比${prev}${st.min>=pv.min?'多':'少'} ${Math.abs(Math.round((st.min-pv.min)/pv.min*100))}%`:''):'')+'。');
    if(tg.length)ns.push(`时间主要花在${tagName(tg[0])}（${Math.round(st.byTag[tg[0]]/st.min*100)}%）${tg[1]?'和'+tagName(tg[1])+'（'+Math.round(st.byTag[tg[1]]/st.min*100)+'%）':''}。`);
    if(bd[1]>=60)ns.push(`最投入的一天是 ${wk(bd[0])}，共 ${fmtMin(bd[1])}。`);
    if(proj.length)ns.push(proj.length===1?proj[0].t+'。':`${proj.length} 个长线项目有进展，其中${proj[0].t}。`);
    const bigA=ach.filter(x=>x.big||x.star);if(bigA.length)ns.push(`值得记一笔的是：${bigA.slice(0,3).map(x=>x.t).join('；')}。`);
    if(od.length)ns.push(`还有 ${od.length} 件事过期没做。`)}
  let foot=null;if(kind==='year'){foot=[];const y=from.slice(0,4);for(let m=1;m<=12;m++){const a=y+'-'+pad(m)+'-01',[,b]=rangeOf('month',a);if(a>td)break;const s=calc(a,b),tp=Object.entries(s.byTitle).sort((p,q)=>q[1].min-p[1].min)[0];foot.push({m,done:s.done,min:s.min,top:tp&&tp[1].min?tp[0]:''})}}
  const saved=(S.meta.reports||{})[key]||{};
  return{kind,from,to,key,title,sub,nm,st,pv,rate,open,ach,ev,miss,proj,top,notes,pics,money,foot,narr:ns.join(''),mine:saved.t||'',ai:saved.ai||'',file:nm+'-'+(kind==='week'?from:kind==='month'?ymOf(from):from.slice(0,4))};
}
function repText(R){const L=[`# ${R.title}（${R.sub}）`,'',R.ai||R.narr,''],sec=(h,arr)=>{if(arr.length){L.push('## '+h);for(const x of arr)L.push('- '+x.t+(x.s?'（'+x.s+'）':''));L.push('')}};
  L.push(`完成 ${R.st.done}/${R.st.all} 件 · 完成率 ${R.rate}% · 记录用时 ${fmtMin(R.st.min)} · 活跃 ${R.st.active} 天`,'');
  sec('重大成就',R.ach);sec('值得记住的事',R.ev);
  const tg=seriesTags().filter(g=>R.st.byTag[g]).sort((a,b)=>R.st.byTag[b]-R.st.byTag[a]);if(tg.length){L.push('## 时间去向');for(const g of tg)L.push(`- ${tagName(g)}：${fmtMin(R.st.byTag[g])}（${Math.round(R.st.byTag[g]/R.st.min*100)}%）`);L.push('')}
  if(R.top.length){L.push('## 投入最多的事');for(const[k,e]of R.top)L.push(`- ${k}：${e.min?fmtMin(e.min):'—'}，${e.n} 次`);L.push('')}
  if(R.foot){L.push('## 逐月足迹');for(const f of R.foot)L.push(`- ${f.m} 月：完成 ${f.done} 件，${fmtMin(f.min)}${f.top?'，主要在做「'+f.top+'」':''}`);L.push('')}
  sec('项目进展',R.proj);if(R.money)L.push('## 收支',R.money.t,'');sec('待改进',R.miss);
  if(R.notes.length){L.push('## 写下的话');for(const n of R.notes)L.push(`- ${mdCN(n.d)}：${n.t.replace(/\n+/g,' ')}`);L.push('')}
  if(R.mine)L.push('## 我的补充',R.mine,'');return L.join('\n').trim()+'\n'}
function hlList(arr,empty){return arr.length?`<ul class="hl">${arr.map(x=>`<li class="${x.star?'star':''}"><span>${esc(x.t)}${x.s?`<small>${esc(x.s)}</small>`:''}</span></li>`).join('')}</ul>`:`<p class="empty" style="padding:0">${empty}</p>`}
function vReport(){

  const topH=R.top.length?R.top.map(([k,e])=>`<div class="actrow"><span class="nm"><i class="dot" style="background:${tagColor(e.g)}"></i><span>${esc(k)}</span></span><span class="n">${e.n} 次</span><span class="num">${e.min?fmtMin(e.min):'—'}</span></div>`).join(''):'<p class="empty" style="padding:0">完成或计时过的事项会出现在这里。</p>';
  const foot=R.foot?`<section class="card"><h2>逐月足迹</h2>${R.foot.map(f=>`<div class="foot-m"><b class="num">${f.m} 月</b><span>${f.top?'主要在做「'+esc(f.top)+'」':'<span class="muted">没有记录用时</span>'}</span><span class="num muted">完成 ${f.done} 件</span><span class="num">${fmtH(f.min)}</span></div>`).join('')}</section>`:'';
  return `<div class="row">${seg}<span class="sp" style="flex:1"></span>${Store.sample?`<button class="btn sm" data-act="repAI">让 Claude 润色总结</button>`:''}<button class="btn sm" data-act="repCopy">复制为文字</button></div>
  <section class="card rep-lead"><h2>${R.title} <small>${R.sub}</small></h2><p>${esc(R.ai||R.narr)}</p>${R.ai?`<div class="small muted" style="margin-top:8px">由 Claude 根据下面的数据改写。<button class="lnk" data-act="repAIClear">恢复自动总结</button></div>`:''}</section>
  <section class="sum">
    <div class="kpi"><span>完成事项</span><b>${st.done}<small>/ ${st.all}</small></b>${R.open?'<em>这一期还没结束</em>':delta(st.done,R.pv.done)}</div>
    <div class="kpi"><span>完成率</span><b>${R.rate}<small>%</small></b><div class="meter"><i style="width:${R.rate}%"></i></div></div>
    <div class="kpi"><span>记录用时</span><b>${fmtH(st.min)}</b>${R.open?`<em>上一期共 ${fmtH(R.pv.min)}</em>`:delta(st.min,R.pv.min)}</div>
    <div class="kpi"><span>有记录的天数</span><b>${st.active}<small>天</small></b><em>活跃日均 ${fmtH(st.active?st.min/st.active:0)}</em></div>
  </section>
  <div class="grid2"><section class="card"><h2>重大成就</h2>${hlList(R.ach,'这一期还没有识别到成就。把最重要的事标上 ★、推进长线项目，做完后会自动出现在这里。')}</section>
  <section class="card"><h2>值得记住的事</h2>${hlList(R.ev,'投入时间长的事、计划外做成的事会列在这里。')}</section></div>
  ${mem}
  <div class="grid2"><section class="card"><h2>时间去向</h2>${tagBars(st)}</section><section class="card"><h2>投入最多的事</h2>${topH}</section></div>
  ${foot}
  <div class="grid2"><section class="card"><h2>项目进展</h2>${hlList(R.proj,'这一期长线项目没有新进展。')}</section><section class="card"><h2>收支</h2>${R.money?`<p style="margin:0;line-height:1.8">${esc(R.money.t)}</p>`:'<p class="empty" style="padding:0">这一期没有记账。</p>'}</section></div>
  <section class="card"><h2>待改进</h2>${hlList(R.miss,'没有发现明显的问题。')}</section>
  <section class="card"><h2>我的补充 <small>写下自己的总结，会一起导出，自动保存</small></h2><textarea class="inp" data-inp="repMine" aria-label="我的补充" placeholder="这一期最想记住的事、下一期想调整的地方…">${esc(R.mine)}</textarea></section>`;
}

function repSeen(k){try{const l=repSeenList();if(!l.includes(k)){l.push(k);localStorage.setItem('sjsz:repseen',JSON.stringify(l.slice(-40)))}}catch(e){}}
function repBanner(d){if(d!==today())return'';const D=parse(d),seen=repSeenList(),c=[];
  if(D.getMonth()===0&&D.getDate()<=10)c.push(['year',ymd(new Date(D.getFullYear()-1,6,1)),'去年的年报']);
  if(D.getDate()<=5)c.push(['month',ymd(new Date(D.getFullYear(),D.getMonth()-1,1)),'上个月的月报']);
  if([1,2,3].includes(D.getDay()))c.push(['week',addDays(d,-7),'上周的周报']);
  for(const[k,a,nm]of c){const key=repKey(k,a);if(seen.includes(key))continue;const[f,t]=rangeOf(k,a);if(!calc(f,t).all)continue;return `<div class="banner"><span>${nm}已经整理好了。</span><span class="sp"></span><button class="btn sm" data-act="repGo" data-k="${k}" data-d="${a}" data-key="${key}">看报告</button><button class="x" data-act="repSeenX" data-key="${key}" aria-label="不再提示">×</button></div>`}
  return''}

function pwaSetup(){
  if(Store.host!=='web'||!/^https?:$/.test(location.protocol))return;
  try{const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};add('manifest','manifest.webmanifest');add('apple-touch-icon','icons/apple-touch-icon.png');
    if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
function appPrefs(){
  if(Store.host!=='web')return'';
  return `<section class="card"><h2>安装为 App</h2>${isStandalone()?'<p style="margin:0">现在就是以 App 方式运行的，数据和网页版完全相同。</p>':`<p style="margin:0 0 10px">这个网站可以直接装成 App：有自己的图标和独立窗口，没网时也能打开，数据和网页版完全相同。</p>
  ${UI.installEvt?'<div class="row" style="margin-bottom:10px"><button class="btn sm pri" data-act="pwaInstall">安装到这台设备</button></div>':''}
  <ul class="small muted" style="display:flex;flex-direction:column;gap:4px"><li>iPhone / iPad：用 Safari 打开本页 → 点分享按钮 → 添加到主屏幕</li><li>Windows：用 Edge 或 Chrome 打开本页 → 点地址栏右侧的安装图标（或菜单 → 应用 → 将此站点作为应用安装）</li><li>Android：用 Chrome 打开本页 → 菜单 → 安装应用 / 添加到主屏幕</li></ul>`}</section>`;
}

function mergeMeta(L,R){const newer=(R.u||0)>(L.u||0),A=newer?R:L,B=newer?L:R,out={...B,...A};
  for(const f of['tags','cats','routines']){const a=Array.isArray(A[f])?A[f]:[],ids=new Set(a.map(x=>x.id));out[f]=a.concat((Array.isArray(B[f])?B[f]:[]).filter(x=>!ids.has(x.id)))}
  const rp={...(B.reports||{})};for(const k in A.reports||{}){const x=A.reports[k],y=rp[k];rp[k]=!y||(x.u||0)>=(y.u||0)?x:y}out.reports=rp;out.u=Math.max(L.u||0,R.u||0);return out}
function cleanImport(o){
  const ok=s=>typeof s==='string'&&/^[\w:.\-]{1,80}$/.test(s),isD=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s),isT=s=>typeof s==='string'&&/^\d\d:\d\d$/.test(s),col=x=>{x.c=Math.min(8,Math.max(1,parseInt(x.c)||1))};
  if(o.meta&&typeof o.meta==='object'){for(const f of['tags','cats','routines'])o.meta[f]=Array.isArray(o.meta[f])?o.meta[f].filter(x=>x&&ok(x.id)):[];o.meta.tags.forEach(col);o.meta.cats.forEach(c=>{col(c);c.k=c.k==='in'?'in':'out'});o.meta.routines=o.meta.routines.filter(r=>Array.isArray(r.days));for(const r of o.meta.routines){if(r.rm&&!isT(r.rm))r.rm='';if(r.g&&!ok(r.g))r.g=''}}
  for(const ym in o.months){const M=o.months[ym];if(!M||typeof M!=='object'||!/^\d{4}-\d{2}$/.test(ym)){delete o.months[ym];continue}
    for(const f of['tasks','pics','bills']){const m=M[f]&&typeof M[f]==='object'?M[f]:{};for(const k in m){const x=m[k];if(!x||!ok(k)||x.id!==k||!isD(x.d)||(x.g&&!ok(x.g))||(x.cat&&!ok(x.cat))||(x.pid&&!ok(x.pid))||(x.rid&&!ok(x.rid))||(x.a&&!ok(x.a))){delete m[k];continue}
      if(x.rm&&!isT(x.rm))delete x.rm;if(f==='bills'){x.amt=Math.abs(+x.amt)||0;x.k=x.k==='in'?'in':'out'}if(f==='tasks'&&!x.del){x.plan=Math.max(0,+x.plan||0);x.logs=Array.isArray(x.logs)?x.logs.filter(l=>l&&+l.m>0).map(l=>({s:+l.s||null,m:+l.m})):[]}}M[f]=m}}
  o.projects=o.projects&&typeof o.projects==='object'?o.projects:{};
  for(const id in o.projects){const p=o.projects[id];if(!p||!ok(id)||p.id!==id){delete o.projects[id];continue}p.kind=p.kind==='qty'?'qty':'ms';if(!isD(p.start))p.start=today();if(p.due&&!isD(p.due))p.due=null;if(p.rm&&!isT(p.rm))p.rm='';
    if(p.kind==='qty'){p.target=+p.target||0;p.logs=Array.isArray(p.logs)?p.logs.filter(l=>l&&isD(l.d)&&+l.n>0).map(l=>({d:l.d,n:+l.n})):[]}
    else{p.stages=Array.isArray(p.stages)?p.stages:[];for(const s of p.stages){if(!ok(s.id))s.id=uid();s.goals=Array.isArray(s.goals)?s.goals:[];for(const g of s.goals){if(!ok(g.id))g.id=uid();g.pct=Math.min(100,Math.max(0,+g.pct||0));g.size=[1,2,3].includes(g.size)?g.size:2;if(g.w!=null)g.w=Math.min(10,Math.max(1,+g.w||5))}}
      const h={};for(const k in p.hist||{})if(isD(k))h[k]=+p.hist[k]||0;p.hist=h}}
}
function billModal(b){
  const opts=k=>(S.meta.cats||[]).filter(c=>c.k===k).map(c=>`<option value="${c.id}" ${b.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  openModal(`<h2>修改这一笔<span class="sp"></span><button class="x" data-act="close" aria-label="关闭">×</button></h2>
  <form data-sub="billSave" data-d="${b.d}" data-id="${b.id}" style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><label class="f grow">类型<select class="inp" name="k"><option value="out" ${b.k!=='in'?'selected':''}>支出</option><option value="in" ${b.k==='in'?'selected':''}>收入</option></select></label><label class="f grow">金额<input class="inp num" name="amt" inputmode="decimal" value="${b.amt}" required autofocus></label></div>
    <div class="row"><label class="f grow">分类<select class="inp" name="cat"><optgroup label="支出">${opts('out')}</optgroup><optgroup label="收入">${opts('in')}</optgroup></select></label><label class="f grow">日期<input class="inp" type="date" name="d" value="${b.d}" required></label></div>
    <label class="f">备注<input class="inp" name="note" value="${esc(b.note||'')}" maxlength="40"></label>
    <div class="foot"><button type="button" class="btn" data-act="close">取消</button><button class="btn pri">保存</button></div></form>`);
}

const EX_README=`四季手账 · 数据迁移包
======================

这个压缩包是你在「四季手账」里全部记录的一份完整拷贝，整理成了通用格式：
不依赖这个软件也能读，方便以后搬到别的软件、小程序，或者自己用 Excel 分析。

文件说明
--------
data.json          全部数据，一个文件。字段名是完整的英文单词，日期是 YYYY-MM-DD，时间点是 ISO 8601（UTC）。
                   给程序读用这个：结构最完整。
tasks.csv          事项：每行一件事（日期、标题、标签、是否完成、完成时间、计划分钟、实际分钟、是否重点、是否计划外、顺延次数、所属项目、安排人）
time_logs.csv      计时记录：每行一段用时（属于哪件事、开始时间、分钟数）
bills.csv          账目：每行一笔（日期、收入/支出、金额、分类、备注）
day_scores.csv     每日打分：每行一天（总分 0–100、各维度 1–5 分、几点睡、几点起、睡眠小时数）
notes.csv          每日小结：每行一天
projects.csv       长线项目：每行一个项目（类型、起止、目标、当前进度）
project_logs.csv   数量累计型项目的每次记录（日期、数量）
project_goals.csv  阶段目标型项目的阶段和小目标（权重、完成度、完成时间）
photos.csv         照片清单；选了「包含照片」时，原图在 photos/ 文件夹里，文件名是「日期_编号」
backup.json        本软件自己的备份格式。想把数据装回「四季手账」，在「设置 → 数据 → 导入备份并合并」里选它。

约定
----
- CSV 是 UTF-8 编码（带 BOM），Excel、Numbers、WPS 可以直接打开。
- 空着的格子表示「没有记录」，不是 0。
- 总分的算法：每个维度 1–5 分折算成 0–100（1 分 = 0，5 分 = 100），再按权重平均。
- 删除过的记录不在包里。
- data.json 顶层的 format / version 标明了格式版本，以后格式有变化会升版本号。
